name: Собрать APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Сборка
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Опубликовать APK (релиз latest)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk StreamScene.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StreamScene.apk \
            --title "СтримСцена — сборка ${{ github.run_number }}" \
            --notes "Скачай StreamScene.apk на телефон и установи." \
            --target "${{ github.sha }}"

      - name: Опубликовать лог ошибки
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 400 build.log > build-error.log || echo "no log" > build-error.log
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build-error.log --prerelease \
            --title "Лог ошибки сборки ${{ github.run_number }}" --notes "Ошибка сборки" \
            --target "${{ github.sha }}"
