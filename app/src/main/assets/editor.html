<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e0e10">
<title>СтримСцена</title>
<style>
:root{--bg:#0e0e10;--card:#18181b;--card2:#232329;--line:#2f2f37;--text:#efeff1;--mute:#a0a0ad;--acc:#9147ff;--acc2:#772ce8;--bad:#ff4f4f;--ok:#00c896}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,14,16,.95);backdrop-filter:blur(8px);z-index:10}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap}
header h1 span{color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 11px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc)}
.btn.bad{background:#3a1717;border-color:#5a2222;color:#ff9a9a}
.btn.on{background:#3b2a5c;border-color:var(--acc)}
.btn.sm{padding:6px 9px;font-size:13px}
#screenProps .btn{white-space:normal;text-align:center}
.scenes{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:none}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600}
.scene.on{background:var(--acc);border-color:var(--acc)}
.stagewrap{padding:8px 12px;position:relative}
.stage{position:relative;margin:0 auto;background:repeating-conic-gradient(#1c1c21 0 25%,#141418 0 50%) 0 0/20px 20px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
canvas#cv{display:block;width:100%;height:100%;touch-action:none}
.hint{color:var(--mute);font-size:12px;text-align:center;margin:6px 0 0}
.panel{margin:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.panel h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);display:flex;align-items:center;gap:8px}
.panel h3 .sp{flex:1}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.sl{display:flex;align-items:center;gap:10px;margin-top:10px}
.sl label{color:var(--mute);font-size:13px;width:92px}
.sl input[type=range]{flex:1;accent-color:var(--acc)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
.inp:focus{border-color:var(--acc)}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.layer.on{border-color:var(--acc);background:#2a2238}
.layer .th{width:44px;height:26px;border-radius:5px;background:#000 center/contain no-repeat;flex:none;display:grid;place-items:center;font-size:15px}
.layer .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer button{background:none;border:0;padding:4px 6px;font-size:16px}
.add{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.add .btn{flex-direction:column;gap:3px;padding:10px 4px;font-size:12px}
.add .btn i{font-style:normal;font-size:20px}
.tpl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tpl button{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px}
.tpl img{width:100%;aspect-ratio:3/1;object-fit:contain;background:#0a0a0c;border-radius:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#2b2b33;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:90;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:16px;border-top:1px solid var(--line);animation:up .2s ease;max-height:85vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}
#sheet h4{margin:0 0 10px;font-size:17px}
#sheet .opts{display:flex;flex-direction:column;gap:8px}
#sheet .btn{width:100%;padding:12px}
/* live preview */
#live{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
#live .lv{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#live canvas{max-width:100%;max-height:100%}
#live .bar{display:flex;gap:6px;padding:10px;overflow-x:auto;background:#0e0e10;border-top:1px solid var(--line);align-items:center}
#live .badge{position:absolute;top:12px;left:12px;background:#e91916;color:#fff;font-weight:800;border-radius:6px;padding:4px 8px;font-size:13px}
#live .note{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#ddd;border-radius:6px;padding:4px 8px;font-size:12px}
#statusBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1d1424;border-bottom:1px solid #3b2a5c;font-size:13px}
#statusBar .sp{flex:1}
#statusBar .sdot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
#statusBar.live .sdot{background:#e91916;box-shadow:0 0 0 4px rgba(233,25,22,.25)}
#statusBar.warn .sdot{background:#ffb31a}
#statusBar.err{background:#2a1414}
#statusBar.err .sdot{background:var(--bad)}
.btn.stop{background:#e91916;border-color:#e91916}
.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 5px}
select.inp{appearance:auto}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.add .btn .ic{width:24px;height:24px}
.layer .th .ic{width:16px;height:16px}
.rdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:6px}
.acct{display:flex;align-items:center;gap:10px}
.acct img{width:40px;height:40px;border-radius:50%;background:#26262c;object-fit:cover}
.acct .nm{flex:1;min-width:0;font-weight:700}
.acct .nm small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.code{font:800 32px/1.2 ui-monospace,Menlo,monospace;letter-spacing:4px;text-align:center;background:#26262c;border-radius:12px;padding:14px;margin:4px 0}
.steps{margin:0;padding-left:20px;color:#d6d6de;font-size:14px}
.steps li{margin:6px 0}
.steps a{color:#bf94ff}
.steps code{background:#26262c;border-radius:6px;padding:1px 6px}
.sugg{background:var(--card2);border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;color:inherit}
.sugg button:last-child{border-bottom:0}
.sugg img{width:26px;height:36px;border-radius:4px;background:#333;object-fit:cover}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.tog small{display:block;color:var(--mute);font-size:12px}
.sw{position:relative;width:46px;height:27px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#3a3a44;border-radius:999px;transition:.2s}
.sw span:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{transform:translateX(19px)}
details.man{margin-top:4px}
details.man summary{color:var(--mute);font-size:13px;cursor:pointer;padding:6px 0}
@media (min-width:900px){
  body{display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto auto 1fr}
  header{grid-column:1/3}.scenes{grid-column:1/3}
  .stagewrap{grid-column:1}.side{grid-column:2;grid-row:3/5;overflow:auto}
}
</style>
</head>

<header>
  <h1>Стрим<span>Сцена</span></h1>
  <button class="btn sm" id="btnOrient">16:9</button>
  <button class="btn sm" id="btnLive2" aria-label="Предпросмотр"><svg class="ic"><use href="#i-eye"/></svg></button>
  <button class="btn sm pri" id="btnStream"><svg class="ic"><use href="#i-live"/></svg>В эфир</button>
</header>
<div id="statusBar" class="hidden"><span class="sdot"></span><span id="stText"></span><span class="sp"></span><button class="btn sm" id="btnHome">К игре <svg class="ic"><use href="#i-out"/></svg></button></div>

<div class="scenes" id="scenes"></div>

<div class="stagewrap">
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <p class="hint">Тяни слой пальцем · уголки — размер · двумя пальцами — масштаб</p>
</div>

<div class="side">
  <div class="panel" id="twCard">
    <h3>Канал Twitch</h3>
    <div id="twBody"></div>
  </div>
  <div class="panel" id="selPanel">
    <h3><span id="selName">Ничего не выбрано</span><span class="sp"></span><span id="selSize" style="text-transform:none;letter-spacing:0"></span></h3>
    <div id="selBody">
      <div class="row">
        <button class="btn" data-op="fit"><svg class="ic"><use href="#i-fit"/></svg>Вписать</button>
        <button class="btn" data-op="fill"><svg class="ic"><use href="#i-fill"/></svg>Заполнить</button>
        <button class="btn" data-op="stretch"><svg class="ic"><use href="#i-stretch"/></svg>Растянуть</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn" data-op="center"><svg class="ic"><use href="#i-center"/></svg>По центру</button>
        <button class="btn" data-op="lock" id="opLock"><svg class="ic"><use href="#i-lock"/></svg>Пропорции</button>
        <button class="btn" data-op="flip"><svg class="ic"><use href="#i-flip"/></svg>Отразить</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn" data-op="up"><svg class="ic"><use href="#i-up"/></svg>Выше</button>
        <button class="btn" data-op="down"><svg class="ic"><use href="#i-down"/></svg>Ниже</button>
        <button class="btn" data-op="dup"><svg class="ic"><use href="#i-copy"/></svg>Копия</button>
        <button class="btn bad" data-op="del" aria-label="Удалить"><svg class="ic"><use href="#i-trash"/></svg></button>
      </div>
      <div class="sl"><label>Прозрачность</label><input type="range" id="opOpacity" min="10" max="100"></div>
      <div class="sl"><label>Скругление</label><input type="range" id="opRadius" min="0" max="50"></div>
      <div id="textProps" class="hidden">
        <div style="height:10px"></div>
        <input class="inp" id="opText" placeholder="Текст">
        <div class="sl"><label>Цвет текста</label><input type="color" id="opColor"></div>
        <div class="sl"><label>Цвет плашки</label><input type="color" id="opBg"><button class="btn sm" id="opBgOff">Без плашки</button></div>
      </div>
      <div id="screenProps" class="hidden" style="margin-top:10px">
        <button class="btn" style="width:100%" id="opSource"><svg class="ic"><use href="#i-film"/></svg>Для примера: подставить запись экрана из галереи</button>
        <button class="btn" style="width:100%;margin-top:6px" id="opDemoSrc"><svg class="ic"><use href="#i-game"/></svg>Вернуть демо-игру</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h3>Добавить</h3>
    <div class="add">
      <button class="btn" id="addImg"><svg class="ic"><use href="#i-image"/></svg>Фото</button>
      <button class="btn" id="addText"><svg class="ic"><use href="#i-text"/></svg>Текст</button>
      <button class="btn" id="addTpl"><svg class="ic"><use href="#i-banner"/></svg>Баннер</button>
      <button class="btn" id="addScreen"><svg class="ic"><use href="#i-game"/></svg>Экран</button>
    </div>
  </div>

  <div class="panel">
    <h3>Слои <span class="sp"></span><span style="text-transform:none;letter-spacing:0">сверху вниз</span></h3>

  </div>

  <div class="panel">
    <h3>Сцена</h3>
    <div class="sl" style="margin-top:0"><label>Фон сцены</label><input type="color" id="sceneBg"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="scRename"><svg class="ic"><use href="#i-edit"/></svg>Переименовать</button>

    </div>

  </div>
  <div style="height:30px"></div>
</div>

<div id="live" class="hidden">
  <div class="lv"><canvas id="lcv"></canvas><div class="badge"><span class="rdot"></span><span id="lvTime">ТЕСТ 00:00</span></div><div class="note">Так увидят зрители · поверни телефон</div></div>
  <div class="bar" id="lvBar"></div>
</div>

<input type="file" id="fileImg" accept="image/*" class="hidden">
<input type="file" id="fileSrc" accept="video/*,image/*" class="hidden">

<script>
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const NATIVE = window.Native || null;
const I = (n, cls = '') => `<svg class="ic${cls ? ' ' + cls : ''}"><use href="#i-${n}"/></svg>`;
const store = {
  get(k, d) {
    try { const v = NATIVE ? NATIVE.kvGet(k) : localStorage.getItem('ss_' + k); return v == null ? d : JSON.parse(v); } catch { return d; }
  },
  set(k, v) {
    try { const j = JSON.stringify(v); if (NATIVE) NATIVE.kvSet(k, j); else localStorage.setItem('ss_' + k, j); return true; } catch { return false; }
  }
};
let INFO = { screenLong: 2400, screenShort: 1080, state: 'stopped', msg: '', current: 0 };
try { if (NATIVE) INFO = JSON.parse(NATIVE.info()); } catch {}
let toastT;
function toast(t) { const e = $('#toast'); e.textContent = t; e.className = 'show'; clearTimeout(toastT); toastT = setTimeout(() => e.className = '', 2200); }
function closeSheet() { $('#sheetBg')?.remove(); }
function sheet(title, build) {
  closeSheet();
  const bg = document.createElement('div'); bg.id = 'sheetBg';
  bg.innerHTML = `<div id="sheet"><h4>${esc(title)}</h4><div class="opts"></div></div>`;
  bg.onclick = e => { if (e.target === bg) closeSheet(); };
  document.body.appendChild(bg); build(bg.querySelector('.opts'));
}
function sheetOpts(title, opts) {
  sheet(title, box => [...opts, { label: 'Отмена' }].forEach(o => {
    const b = document.createElement('button'); b.className = 'btn ' + (o.cls || ''); b.textContent = o.label;
    b.onclick = () => { closeSheet(); o.fn && o.fn(); }; box.appendChild(b);
  }));
}
function askText(title, val, cb) {
  sheet(title, box => {

function readImage(file, maxSide = 1600) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, maxSide / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res({ src: c.toDataURL(/jpe?g/.test(file.type) ? 'image/jpeg' : 'image/png', .9), w: c.width, h: c.height });
      };
      im.onerror = () => rej(new Error('Не удалось открыть картинку')); im.src = fr.result;
    };
    fr.onerror = () => rej(fr.error); fr.readAsDataURL(file);
  });
}
function addImageLayer(name, src, w, h) {
  const k = Math.min(1, (W * .5) / w, (H * .5) / h), lw = w * k, lh = h * k;
  const l = newLayer('image', { name, src, x: (W - lw) / 2, y: (H - lh) / 2, w: lw, h: lh });
  layers().push(l); selId = l.id; save(); renderUI();
}

function setOrient(o) {
  if (o === ORIENT) return;
  const [ow, oh] = [W, H]; ORIENT = o; applyOrient();
  // переносим слои пропорционально, чтобы ничего не уехало за кадр
  scenes.forEach(s => s.layers.forEach(l => {
    const full = Math.abs(l.w - ow) < 2 && Math.abs(l.h - oh) < 2;
    if (full) Object.assign(l, { x: 0, y: 0, w: W, h: H });
    else if (l.type === 'screen') Object.assign(l, fitRect(natAR(l), 'fit'));
    else { const k = Math.min(W / ow, H / oh); l.w *= k; l.h *= k; l.x = l.x / ow * W; l.y = l.y / oh * H; l.x = clamp(l.x, 0, W - l.w); l.y = clamp(l.y, 0, H - l.h); }

/* ---------- сборка сцен для эфира ---------- */
function ensureImages() {
  const all = [];
  scenes.forEach(sc => sc.layers.forEach(l => { if (l.type === 'image') all.push(layerSrcEl(l)); }));
  return Promise.all(all.map(im => im.complete && im.naturalWidth ? null : new Promise(r => { im.onload = im.onerror = r; })));
}
function buildScene(sc, EW, EH) {
  const c = document.createElement('canvas'); c.width = EW; c.height = EH;
  const x = c.getContext('2d'); x.scale(EW / W, EH / H);
  x.fillStyle = sc.bg || '#000'; x.fillRect(0, 0, W, H);
  let screen = null;
  for (const l of sc.layers) {
    if (!l.visible) continue;
    if (l.type === 'screen') {
      const r = Math.min(l.radius / 100 * Math.min(l.w, l.h), Math.min(l.w, l.h) / 2);
      x.save(); x.globalCompositeOperation = 'destination-out'; x.globalAlpha = l.opacity;
      x.beginPath(); x.roundRect(l.x, l.y, l.w, l.h, r); x.fill(); x.restore();
      screen = { x: l.x / W, y: l.y / H, w: l.w / W, h: l.h / H, flip: !!l.flip };
    } else drawLayer(x, l);
  }
  return { name: sc.name, screen, overlay: c.toDataURL('image/png') };
}
async function buildAll() { await ensureImages(); const [EW, EH] = outDims(); return scenes.map(sc => buildScene(sc, EW, EH)); }

function setStatus() {

    if (liveViewers != null) parts.push(`${liveViewers} ${plural(liveViewers, 'зритель', 'зрителя', 'зрителей')}`);
    if (liveKbps) parts.push(`${(liveKbps / 1000).toFixed(1)} Мбит/с`);
    parts.push(scene().name);
  }
  const txt = {
    connecting: 'Подключаюсь к Twitch…',
    live: parts.join(' · '),
    reconnecting: 'Переподключение…' + (liveMsg ? ' (' + liveMsg + ')' : ''),
    error: liveMsg || 'Ошибка'
  }[liveState];
  bar.className = (txt ? '' : 'hidden ') + (liveState === 'live' ? 'live' : liveState === 'error' ? 'err' : 'warn');
  $('#stText').innerHTML = (liveState === 'error' ? I('warn') + ' ' : '') + esc(txt || '');
  $('#btnHome').classList.toggle('hidden', !live);
  const b = $('#btnStream');

  b.classList.toggle('stop', live); b.classList.toggle('pri', !live);
}
window.onNative = o => {
  switch (o.state) {
    case 'api': { const w = apiWait[o.id]; if (!w) return; delete apiWait[o.id]; let j = null; try { j = JSON.parse(o.body); } catch {} if (o.code >= 200 && o.code < 300) w.res(j); else w.rej(new Error((j && j.message) || ('Ошибка ' + o.code))); if (o.code === 401) twRefresh(); return; }
    case 'tw': onTwEvent(o); return;
    case 'resume': twRefresh(); return;
    case 'viewers': liveViewers = o.count; setStatus(); return;
    case 'mic': toast(o.muted ? 'Микрофон выключен' : 'Микрофон включён'); return;
    case 'bitrate': liveKbps = o.kbps; setStatus(); return;
    case 'scene': if (typeof o.index === 'number' && o.index !== cur && o.index < scenes.length) { cur = o.index; selId = null; renderUI(); } setStatus(); return;
  }
  liveState = o.state; liveMsg = o.msg || '';
  if (liveState === 'live' && !wasLive) { wasLive = true; toast('Ты в эфире! Сворачивай и запускай игру'); }

};

    box.innerHTML = `
      ${TW.loggedIn ? `
        <div class="acct">${TW.avatar ? `<img src="${esc(TW.avatar)}" alt="">` : ''}<div class="nm">${esc(TW.displayName || TW.login)}<small>ключ трансляции возьмём автоматически</small></div></div>
        <label class="f">Название стрима</label><input class="inp" id="skTitle" maxlength="140" placeholder="Загружаю…">
        <label class="f">Категория</label><input class="inp" id="skCat" placeholder="Начни вводить название игры" autocomplete="off"><div id="skSugg" class="sugg hidden"></div>
      ` : `
        <button class="btn pri" id="skLogin">${I('user')}Войти через Twitch</button>
        <details class="man"><summary>или вставить ключ трансляции вручную</summary>
          <div style="display:flex;gap:6px;margin-top:6px"><input class="inp" id="skKey" type="password" placeholder="live_123456789_..." autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="skEye" style="width:auto" aria-label="Показать">${I('eye')}</button></div>
          <a href="#" id="skKeyHelp" style="font-size:13px;color:#bf94ff;display:block;margin-top:6px">Где взять: Панель автора → Настройки → Трансляция</a>
        </details>`}
      <label class="f">Качество</label><select class="inp" id="skQ">${opt(QUALITY, streamCfg.quality)}</select>
      <label class="f">Звук</label><select class="inp" id="skA">${opt(AUDIO, streamCfg.audio)}</select>
      <label class="f">Как держишь телефон в игре</label><select class="inp" id="skG"><option value="land"${GAME_PORT ? '' : ' selected'}>Горизонтально (большинство игр)</option><option value="port"${GAME_PORT ? ' selected' : ''}>Вертикально</option></select>
      <div class="tog"><div>Плавающий кружок поверх игры<small>зрители, соединение, сцены, микрофон</small></div><label class="sw"><input type="checkbox" id="skBub"${streamCfg.bubble ? ' checked' : ''}><span></span></label></div>
      <button class="btn pri" id="skGo">${I('live')}Начать стрим</button>
      <button class="btn" id="skNo">Отмена</button>
      <p style="font-size:12px;color:var(--mute);margin:4px 0 0">Android спросит разрешение на запись экрана — выбери <b>«Весь экран»</b>.</p>`;
    box.querySelector('#skNo').onclick = closeSheet;
    if (TW.loggedIn) {
      const t = box.querySelector('#skTitle'), c = box.querySelector('#skCat'), sg = box.querySelector('#skSugg');
      tw('GET', 'channels', { broadcaster_id: TW.userId }).then(r => {
        chan = (r && r.data && r.data[0]) || {};
        t.value = chan.title || ''; t.placeholder = 'Название стрима';
        c.value = chan.game_name || ''; catSel = chan.game_id ? { id: chan.game_id, name: chan.game_name } : null;
      }).catch(e => { t.placeholder = 'Название стрима'; toast(e.message); });
      c.oninput = () => {
        catSel = null; clearTimeout(catT); const q = c.value.trim();
        if (q.length < 2) { sg.classList.add('hidden'); return; }
        catT = setTimeout(async () => {
          try {
            const r = await tw('GET', 'search/categories', { query: q, first: 6 });
            sg.innerHTML = '';
            (r.data || []).forEach(g => {
              const b = document.createElement('button');
              b.innerHTML = `<img src="${esc(String(g.box_art_url || '').replace(/\d+x\d+|\{width\}x\{height\}/, '52x72'))}" alt=""><span>${esc(g.name)}</span>`;
              b.onclick = () => { catSel = { id: g.id, name: g.name }; c.value = g.name; sg.classList.add('hidden'); };
              sg.appendChild(b);
            });
            sg.classList.toggle('hidden', !(r.data || []).length);
          } catch (e) { toast(e.message); }
        }, 300);
      };
    } else {
      box.querySelector('#skLogin').onclick = () => twLoginFlow(() => openStreamSheet());
      const key = box.querySelector('#skKey'); key.value = store.get('key', '');
      box.querySelector('#skEye').onclick = () => key.type = key.type === 'password' ? 'text' : 'password';
      box.querySelector('#skKeyHelp').onclick = e => { e.preventDefault(); NATIVE.openUrl('https://dashboard.twitch.tv/settings/stream'); };
    }
    box.querySelector('#skGo').onclick = async () => {
      streamCfg.quality = box.querySelector('#skQ').value; streamCfg.audio = box.querySelector('#skA').value;
      streamCfg.bubble = box.querySelector('#skBub').checked;
      store.set('streamCfg', streamCfg);
      const port = box.querySelector('#skG').value === 'port';
      let key = '';
      const go = box.querySelector('#skGo'); go.disabled = true;
      try {
        if (TW.loggedIn) {
          const title = box.querySelector('#skTitle').value.trim(), catText = box.querySelector('#skCat').value.trim();
          const patch = {};
          if (chan && title && title !== chan.title) patch.title = title;
          if (catSel && chan && catSel.id !== chan.game_id) patch.game_id = catSel.id;
          if (catText && !catSel) { toast('Выбери категорию из списка'); go.disabled = false; return; }
          if (Object.keys(patch).length) await tw('PATCH', 'channels', { broadcaster_id: TW.userId }, patch);
          const r = await tw('GET', 'streams/key', { broadcaster_id: TW.userId });
          key = r && r.data && r.data[0] && r.data[0].stream_key;
          if (!key) throw new Error('Twitch не отдал ключ трансляции');
        } else {
          key = box.querySelector('#skKey').value.trim().replace(/^.*\/app\//, '');
          if (key.length < 10) { toast('Войди через Twitch или вставь ключ'); go.disabled = false; return; }
          store.set('key', key);
        }
      } catch (e) { toast(e.message); go.disabled = false; return; }
      if (port !== GAME_PORT) {
        setGameAspect(port);
        scenes.forEach(sc => sc.layers.forEach(l => { if (l.type === 'screen') Object.assign(l, fitRect(natAR(l), 'fit')); }));
        save(); renderUI();
      }
      if (streamCfg.bubble && !NATIVE.canOverlay()) {
        sheet('Разреши кружок поверх игры', b2 => {
          b2.innerHTML = `<div style="color:#d6d6de;font-size:14px">Чтобы кружок со зрителями был виден в игре, включи для СтримСцены <b>«Поверх других приложений»</b>, вернись и нажми «Запустить».</div>
            <button class="btn" id="ovSet">${I('out')}Открыть настройки</button>
            <button class="btn pri" id="ovGo">${I('live')}Запустить</button>`;
          b2.querySelector('#ovSet').onclick = () => NATIVE.requestOverlay();
          b2.querySelector('#ovGo').onclick = () => { closeSheet(); launch(key, NATIVE.canOverlay()); };
        });
        return;
      }
      closeSheet(); launch(key, streamCfg.bubble);
    };
  });
}
async function launch(key, bubble) {
  liveState = 'connecting'; liveMsg = ''; setStatus();
  try {
    const out = await buildAll(), q = QUALITY[streamCfg.quality], [w, h] = outDims();
    NATIVE.start(JSON.stringify({ url: INGEST + key, width: w, height: h, fps: q.fps, bitrate: q.kbps, audio: streamCfg.audio, gameLandscape: !GAME_PORT, bubble, scenes: out, current: cur }));
  } catch (e) { liveState = 'error'; liveMsg = 'Не удалось подготовить сцены: ' + e.message; setStatus(); }
}
twRefresh();

load(); if (NATIVE && isLive()) cur = clamp(INFO.current || 0, 0, scenes.length - 1); renderUI(); setStatus(); requestAnimationFrame(loop);
</script>
</body>
</html>
